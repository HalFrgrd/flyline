[package]
name = "flyline"
version = "1.5.0"
edition = "2024"

[lints.clippy]
disallowed_methods = "deny"


[lib]
crate-type = ["cdylib"]

[dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["local_dynamic_tls"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.6.3", features = ["unstable-dynamic"] }
ratatui = { git = "https://github.com/HalFrgrd/ratatui.git", rev = "99afe70184dd50483e0b7c0f6afa515c511af06b", default-features = false, features = ["termina", "unstable-rendered-line-info", "unstable-backend-writer", "serde", "macros"] }
termina = { git = "https://github.com/HalFrgrd/termina.git", rev = "1855029860215e1ec040b4694a8eb11f0c67d1eb" }
chrono = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
parking_lot = "0.12"
ansi-to-tui = { git = "https://github.com/HalFrgrd/ansi-to-tui.git", rev = "78bdac7021836dda51a986a9854e2b01ec2ec317" }
libc = "0.2.186"
anyhow = "1.0.102"
unicode-width = { version = "0.2.0", default-features = false }
unicode-segmentation = "1.13.2"
itertools = "0.14.0"
glob = "0.3.3"
flash = { git = "https://github.com/HalFrgrd/flash.git", rev = "59af2ab94aaa6b7a407d09549605b1d3bc81256c" }
skim = { git = "https://github.com/HalFrgrd/skim", rev = "7908ee85a5f6cd49575925fcc0bdef3999409d26", default-features =  false, features = ["algos_only"]}
lscolors = "0.21.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
shlex = "1.3.0"
rand = "0.10.1"
duration-str = "0.21.0"
parse-style = { version = "0.4.0" }
easing-function = "0.1.1"
strum = { version = "0.28.0", features = ["derive"] }
ctor = "1.0.7"
flycomp = { git = "https://github.com/HalFrgrd/flycomp.git", rev = "754be16d7a2130ad12b6d038d42a8933c92c103f" }

[features]
pre_bash_4_4 = []

[dev-dependencies]
rusty-fork = "0.3.1"

[profile.release]
panic = "unwind"
overflow-checks = true
lto = true

[build-dependencies]
chrono = { version = "0.4" }

# cross-rs configurations
[package.metadata.cross.target.x86_64-unknown-linux-gnu]
dockerfile = "docker/cross/x86_64-unknown-linux-gnu.Dockerfile"
[package.metadata.cross.target.aarch64-unknown-linux-gnu]
dockerfile = "docker/cross/aarch64-unknown-linux-gnu.Dockerfile"
[package.metadata.cross.target.aarch64-linux-android]
dockerfile = "docker/cross/aarch64-linux-android.Dockerfile"
[package.metadata.cross.target.x86_64-linux-android]
dockerfile = "docker/cross/x86_64-linux-android.Dockerfile"
[package.metadata.cross.target.armv7-linux-androideabi]
dockerfile = "docker/cross/armv7-linux-androideabi.Dockerfile"
[package.metadata.cross.target.i686-linux-android]
dockerfile = "docker/cross/i686-linux-android.Dockerfile"

[patch.crates-io]
termina = { git = "https://github.com/HalFrgrd/termina.git", rev = "1855029860215e1ec040b4694a8eb11f0c67d1eb" }

[patch."https://github.com/HalFrgrd/ratatui.git"]
ratatui = { path = "../ratatui/ratatui" }
ratatui-core = { path = "../ratatui/ratatui-core" }
ratatui-crossterm = { path = "../ratatui/ratatui-crossterm" }
ratatui-macros = { path = "../ratatui/ratatui-macros" }
ratatui-termina = { path = "../ratatui/ratatui-termina" }
ratatui-widgets = { path = "../ratatui/ratatui-widgets" }
